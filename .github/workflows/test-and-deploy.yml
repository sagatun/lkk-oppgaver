name: Oppgaver

on:
  push:
    branches:
      - master
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '10'
      - name: Clone codeclub-viewer
        run: git clone --depth=1 --branch=master https://github.com/sagatun/lkk-codeclub-viewer.git ../codeclub-viewer
      - name: Install Dependencies
        run: |
          cd ../codeclub-viewer
          yarn install
      - name: Build
        run: |
          cd ../codeclub-viewer
          yarn build:travis
      - name: Deploy
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.NORWEGIANMANGO }}
          publish_branch: master
          publish_dir: ../codeclub-viewer/dist/lkk-oppgaver-nettside
          external_repository: sagatun/lkk-oppgaver-nettside
